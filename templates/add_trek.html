{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>

                Add New Trek

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Trek Name</label>

                        <input
                            type="text"
                            class="form-control"
                            name="trek_name"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Location</label>

                        <input
                            type="text"
                            class="form-control"
                            name="location"
                            required>

                    </div>

                    <div class="col-12 mb-3">

                        <label>Description</label>

                        <textarea
                            class="form-control"
                            name="description"
                            rows="3"></textarea>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Difficulty</label>

                        <select
                            class="form-select"
                            name="difficulty">

                            <option>Easy</option>
                            <option>Moderate</option>
                            <option>Hard</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Duration (Days)</label>

                        <input
                            type="number"
                            class="form-control"
                            name="duration"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label>Total Slots</label>

                        <input
                            type="number"
                            class="form-control"
                            name="total_slots"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Start Date</label>

                        <input
                            type="datetime-local"
                            class="form-control"
                            name="start_date"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>End Date</label>

                        <input
                            type="datetime-local"
                            class="form-control"
                            name="end_date"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Status</label>

                        <select
                            class="form-select"
                            name="status">

                            <option>Pending</option>
                            <option>Approved</option>
                            <option>Open</option>
                            <option>Closed</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Assign Staff</label>

                        <select
                            class="form-select"
                            name="assigned_staff_id">

                            <option value="">

                                Not Assigned

                            </option>

                            {% for staff in staff_members %}

                            <option value="{{ staff.user_id }}">

                                {{ staff.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <button
                    class="btn btn-success">

                    Add Trek

                </button>

                <a href="{{ url_for('manage_treks') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
