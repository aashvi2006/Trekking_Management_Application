{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="mb-4">

                <h2>
                    <i class="bi bi-person-circle"></i>
                    My Profile
                </h2>

                <p class="text-muted">
                    View and update your personal information.
                </p>

            </div>

            <div class="card shadow border-0">

                <div class="card-header bg-warning">

                    <h5 class="mb-0">

                        <i class="bi bi-person"></i>
                        Profile Information

                    </h5>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ current_user.username }}"
                                disabled>

                            <div class="form-text">
                                Username cannot be changed.
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                value="{{ current_user.email }}"
                                disabled>

                            <div class="form-text">
                                Email cannot be changed.
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                value="{{ trekker.full_name }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                value="{{ trekker.phone }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Age
                            </label>

                            <input
                                type="number"
                                name="age"
                                class="form-control"
                                value="{{ trekker.age }}"
                                min="1"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Gender
                            </label>

                            <select
                                name="gender"
                                class="form-select"
                                required>

                                <option value="Male"
                                    {% if trekker.gender == "Male" %}
                                        selected
                                    {% endif %}>
                                    Male
                                </option>

                                <option value="Female"
                                    {% if trekker.gender == "Female" %}
                                        selected
                                    {% endif %}>
                                    Female
                                </option>

                                <option value="Other"
                                    {% if trekker.gender == "Other" %}
                                        selected
                                    {% endif %}>
                                    Other
                                </option>

                            </select>

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-warning">

                                <i class="bi bi-save"></i>
                                Update Profile

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
